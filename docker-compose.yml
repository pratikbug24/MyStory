services:
  mystory:
    build: .
    image: mystory:latest
    container_name: mystory
    ports:
      - "8081:8081"
    environment:
      # Override the development placeholder with a real secret in production.
      JWT_SECRET: "${JWT_SECRET:-dev-only-secret-change-me-8f2b1c4d9e6a7b3f5c0d2e4a6b8c1d3f}"
      # Set to "true" when serving over HTTPS.
      JWT_COOKIE_SECURE: "false"
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
    volumes:
      # Persist the SQLite database and uploaded profile photos across restarts.
      - mystory-data:/app/data
      - mystory-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health_check"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  mystory-data:
  mystory-uploads:
