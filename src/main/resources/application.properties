# ==========================
# SQLite Database
# ==========================
spring.datasource.url=jdbc:sqlite:journal.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate Dialect
spring.jpa.database-platform=org.sqlite.hibernate.dialect.SQLiteDialect

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable JDBC metadata lookup
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ==========================
# JSP Configuration
# ==========================
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ==========================
# Server
# ==========================
server.port=8081

# ==========================
# Uploads
# ==========================
# Directory where profile photos are stored. Relative paths are resolved from the
# working directory; mount a volume here in production so photos survive restarts.
app.upload-dir=uploads

# Reject oversized multipart requests before they are buffered in memory
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Parse multipart lazily so an oversized upload raises its exception during
# handler invocation. Parsed eagerly, the resolver throws before a handler is
# resolved, and @ExceptionHandler never sees it ? which turns a client error
# into an opaque 500.
spring.servlet.multipart.resolve-lazily=true


# ==========================
# JWT
# ==========================
# Override in production, e.g. export JWT_SECRET=<base64 or random 32+ byte string>
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-8f2b1c4d9e6a7b3f5c0d2e4a6b8c1d3f}
jwt.expiration-ms=86400000
jwt.cookie-name=journal_jwt
# Send the cookie only over HTTPS (set true in production)
jwt.cookie-secure=false