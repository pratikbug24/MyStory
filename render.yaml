services:
  - type: web
    name: mystory
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health_check
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_COOKIE_SECURE
        value: "true"
      - key: PORT
        value: "8081"
    disk:
      # Persistent storage so the SQLite database and uploads survive redeploys.
      name: mystory-data
      mountPath: /app/data
      sizeGB: 1
